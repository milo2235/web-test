<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡約數字計時器</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 確保頁面滿版並強制居中 */
        html, body {
            height: 100%;
            margin: 0;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 select-none">

    <!-- 主卡片容器：位於畫面正中央 -->
    <div class="bg-white rounded-3xl p-8 sm:p-10 shadow-xl max-w-sm sm:max-w-md w-full flex flex-col items-center justify-center border border-gray-100">
        
        <!-- 時間顯示區域 -->
        <div class="flex items-baseline justify-center mb-8 font-sans tracking-tight text-gray-900">
            <!-- 分:秒 (主字體) -->
            <span id="mainTime" class="text-5xl sm:text-6xl font-semibold">00:00</span>
            <!-- 下二位數 (小一號字體) -->
            <span id="subTime" class="text-3xl sm:text-4xl font-semibold text-gray-700 ml-0.5">.00</span>
        </div>

        <!-- 按鈕控制區域 -->
        <div class="grid grid-cols-3 gap-3 sm:gap-4 w-full">
            <!-- 開始按鈕 (綠色) -->
            <button id="startBtn" onclick="startTimer()" 
                class="py-3 px-2 sm:px-4 rounded-xl font-bold text-base sm:text-lg text-white bg-[#4caf50] hover:bg-[#43a047] active:scale-95 transition-all shadow-md hover:shadow-lg cursor-pointer flex items-center justify-center">
                開始
            </button>

            <!-- 暫停按鈕 (橘色) -->
            <button id="pauseBtn" onclick="pauseTimer()" disabled 
                class="py-3 px-2 sm:px-4 rounded-xl font-bold text-base sm:text-lg text-white bg-[#ff9800] hover:bg-[#fb8c00] active:scale-95 transition-all shadow-md hover:shadow-lg disabled:opacity-40 disabled:cursor-not-allowed disabled:transform-none disabled:shadow-none flex items-center justify-center">
                暫停
            </button>

            <!-- 重置/歸零按鈕 (紅色) -->
            <button id="resetBtn" onclick="resetTimer()" disabled 
                class="py-3 px-2 sm:px-4 rounded-xl font-bold text-base sm:text-lg text-white bg-[#f44336] hover:bg-[#e53935] active:scale-95 transition-all shadow-md hover:shadow-lg disabled:opacity-40 disabled:cursor-not-allowed disabled:transform-none disabled:shadow-none flex items-center justify-center">
                重置
            </button>
        </div>

    </div>

    <!-- 計時器邏輯 JavaScript -->
    <script>
        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval = null;
        let isRunning = false;

        const mainTimeEl = document.getElementById('mainTime');
        const subTimeEl = document.getElementById('subTime');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');

        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            const milliseconds = Math.floor((ms % 1000) / 10);

            const mm = String(minutes).padStart(2, '0');
            const ss = String(seconds).padStart(2, '0');
            const msStr = String(milliseconds).padStart(2, '0');

            return {
                main: `${mm}:${ss}`,
                sub: `.${msStr}`
            };
        }

        function updateDisplay() {
            const timeFormatted = formatTime(elapsedTime);
            mainTimeEl.textContent = timeFormatted.main;
            subTimeEl.textContent = timeFormatted.sub;
        }

        function startTimer() {
            if (isRunning) return;

            isRunning = true;
            startTime = Date.now() - elapsedTime;

            timerInterval = setInterval(() => {
                elapsedTime = Date.now() - startTime;
                updateDisplay();
            }, 10);

            updateUIState();
        }

        function pauseTimer() {
            if (!isRunning) return;

            isRunning = false;
            clearInterval(timerInterval);

            updateUIState();
        }

        function resetTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            elapsedTime = 0;
            updateDisplay();

            updateUIState();
        }

        function updateUIState() {
            if (isRunning) {
                startBtn.disabled = true;
                pauseBtn.disabled = false;
                resetBtn.disabled = false;
            } else {
                startBtn.disabled = false;
                pauseBtn.disabled = true;
                resetBtn.disabled = (elapsedTime === 0);
            }
        }

        // 初始化顯示
        updateDisplay();
        updateUIState();
    </script>
</body>
</html>
