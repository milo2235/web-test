<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科技風數字計時器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0B0F19;
            color: #E2E8F0;
        }

        .digital-font {
            font-family: 'Orbitron', monospace;
        }

        /* LED / 霓虹發光效果 */
        .neon-glow-cyan {
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.6),
                         0 0 20px rgba(6, 182, 212, 0.4),
                         0 0 30px rgba(6, 182, 212, 0.2);
        }

        .neon-box-cyan {
            box-shadow: 0 0 25px -5px rgba(6, 182, 212, 0.25),
                        inset 0 0 15px -5px rgba(6, 182, 212, 0.15);
        }

        /* 脈動燈光效果 */
        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.95); }
        }

        .status-dot-active {
            animation: pulse-glow 1.5s infinite ease-in-out;
        }

        /* 微光的數字背景，模擬未點亮的七段顯示器微弱底紋 */
        .digital-bg-ghost {
            position: absolute;
            color: rgba(15, 23, 42, 0.8);
            user-select: none;
            z-index: 0;
        }

        /* 玻璃擬態面板 */
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* 按鈕 hover 動畫與微光 */
        .btn-glow {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-glow:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px -2px currentColor;
        }
        .btn-glow:active:not(:disabled) {
            transform: translateY(0);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 select-none bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">

    <main class="w-full max-w-xl glass-panel rounded-3xl p-6 sm:p-10 neon-box-cyan relative overflow-hidden">
        
        <!-- 背景裝飾科技線條 -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header / 標頭 -->
        <div class="flex items-center justify-between pb-6 mb-8 border-b border-slate-800/80">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-cyan-500/10 rounded-xl border border-cyan-500/20 text-cyan-400">
                    <i class="fa-solid fa-stopwatch text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wider text-slate-100">CHRONO <span class="text-cyan-400 font-light">TIMER</span></h1>
                    <p class="text-xs text-slate-500 font-mono tracking-widest">DIGITAL PRECISION SYSTEM</p>
                </div>
            </div>

            <!-- 狀態指示燈 -->
            <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-900/80 border border-slate-800 text-xs font-mono">
                <span id="statusIndicator" class="w-2.5 h-2.5 rounded-full bg-slate-600"></span>
                <span id="statusText" class="text-slate-400 uppercase tracking-wider text-[10px]">READY</span>
            </div>
        </div>

        <div class="relative bg-slate-950/90 rounded-2xl p-6 sm:p-8 mb-8 border border-slate-800/80 shadow-inner flex items-center justify-center overflow-hidden">
            
            <!-- 背景網格微紋 -->
            <div class="absolute inset-0 opacity-5 bg-[radial-gradient(#38bdf8_1px,transparent_1px)] [background-size:16px_16px] pointer-events-none"></div>

            <!-- 隱約顯示的 88:88:88.88 背景底紋 (模擬 LED 七段顯示器) -->
            <div class="digital-font digital-bg-ghost text-3xl sm:text-5xl md:text-6xl font-bold tracking-wider text-slate-800/30 flex items-baseline">
                <span>88:88:88</span>
                <span class="text-xl sm:text-3xl md:text-4xl">.88</span>
            </div>

            <!-- 主數字顯示 (HH:MM:SS + 小一號的 .ss) -->
            <div class="digital-font font-bold tracking-wider text-cyan-400 neon-glow-cyan z-10 transition-colors duration-300 flex items-baseline justify-center">
                <span id="displayMain" class="text-3xl sm:text-5xl md:text-6xl">00:00:00</span>
                <span class="text-xl sm:text-3xl md:text-4xl opacity-80">.</span>
                <span id="displaySub" class="text-xl sm:text-3xl md:text-4xl opacity-80">00</span>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-3 sm:gap-4 mb-6">
            <!-- 啟動按鈕 -->
            <button id="startBtn" onclick="startTimer()" class="btn-glow flex flex-col sm:flex-row items-center justify-center gap-2 py-3.5 px-4 rounded-xl font-medium bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 hover:bg-cyan-500/20 active:bg-cyan-500/30 text-slate-300 hover:text-cyan-300">
                <i class="fa-solid fa-play text-base"></i>
                <span class="text-sm font-semibold tracking-wider">啟動</span>
            </button>

            <!-- 暫停按鈕 -->
            <button id="pauseBtn" onclick="pauseTimer()" disabled class="btn-glow flex flex-col sm:flex-row items-center justify-center gap-2 py-3.5 px-4 rounded-xl font-medium bg-amber-500/10 text-amber-400/50 border border-amber-500/20 opacity-50 cursor-not-allowed text-xs sm:text-sm tracking-wider">
                <i class="fa-solid fa-pause text-base"></i>
                <span class="text-sm font-semibold tracking-wider">暫停</span>
            </button>

            <!-- 歸零/重置按鈕 -->
            <button id="resetBtn" onclick="resetTimer()" class="btn-glow flex flex-col sm:flex-row items-center justify-center gap-2 py-3.5 px-4 rounded-xl font-medium bg-rose-500/10 text-rose-400 border border-rose-500/30 hover:bg-rose-500/20 active:bg-rose-500/30 text-slate-300 hover:text-rose-300">
                <i class="fa-solid fa-rotate-right text-base"></i>
                <span class="text-sm font-semibold tracking-wider">歸零</span>
            </button>
        </div>

        <!-- 頁尾說明/紀錄功能擴充區 -->
        <div class="flex items-center justify-between text-xs text-slate-500 pt-4 border-t border-slate-800/60 font-mono">
            <span>FORMAT: HH:MM:SS.SS</span>
            <span id="lapCountText">STATE: IDLE</span>
        </div>
    </main>

    <script>
        // 計時器狀態變數
        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval = null;
        let isRunning = false;

        // DOM 元素引用
        const displayMainEl = document.getElementById('displayMain');
        const displaySubEl = document.getElementById('displaySub');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        const lapCountText = document.getElementById('lapCountText');

        /**
         * 將毫秒轉為 [HH:MM:SS, SS] 格式物件
         * @param {number} ms - 經過的總毫秒數
         * @returns {object} - { main: "HH:MM:SS", sub: "SS" }
         */
        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            
            // 計算百分之一秒 (10ms 單位，範圍 00-99)
            const hundredths = Math.floor((ms % 1000) / 10);

            const paddedH = String(hours).padStart(2, '0');
            const paddedM = String(minutes).padStart(2, '0');
            const paddedS = String(seconds).padStart(2, '0');
            const paddedSub = String(hundredths).padStart(2, '0');

            return {
                main: `${paddedH}:${paddedM}:${paddedS}`,
                sub: paddedSub
            };
        }

        /**
         * 更新介面顯示
         */
        function updateDisplay() {
            const timeObj = formatTime(elapsedTime);
            displayMainEl.textContent = timeObj.main;
            displaySubEl.textContent = timeObj.sub;
        }

        /**
         * 啟動計時
         */
        function startTimer() {
            if (isRunning) return;

            isRunning = true;
            // 計算起點時間（考慮到暫停後恢復繼續）
            startTime = Date.now() - elapsedTime;

            // 每 10 毫秒刷新一次畫面（確保百分之一秒流暢顯示）
            timerInterval = setInterval(() => {
                elapsedTime = Date.now() - startTime;
                updateDisplay();
            }, 10);

            updateUIState('RUNNING');
        }

        /**
         * 暫停計時
         */
        function pauseTimer() {
            if (!isRunning) return;

            isRunning = false;
            clearInterval(timerInterval);

            updateUIState('PAUSED');
        }

        /**
         * 歸零/重置計時
         */
        function resetTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            elapsedTime = 0;
            updateDisplay();

            updateUIState('RESET');
        }

        /**
         * 更新按鈕與狀態指示器的 UI 樣式
         * @param {string} state - 當前狀態 'RUNNING' | 'PAUSED' | 'RESET'
         */
        function updateUIState(state) {
            if (state === 'RUNNING') {
                // 按鈕狀態啟用/停用
                setButtonState(startBtn, false);
                setButtonState(pauseBtn, true);

                // 狀態指示器調整
                statusIndicator.className = 'w-2.5 h-2.5 rounded-full bg-cyan-400 status-dot-active shadow-[0_0_8px_#06b6d4]';
                statusText.textContent = 'RUNNING';
                statusText.className = 'text-cyan-400 tracking-wider text-[10px]';
                lapCountText.textContent = 'STATE: COUNTING';

            } else if (state === 'PAUSED') {
                setButtonState(startBtn, true);
                setButtonState(pauseBtn, false);

                statusIndicator.className = 'w-2.5 h-2.5 rounded-full bg-amber-400 shadow-[0_0_8px_#f59e0b]';
                statusText.textContent = 'PAUSED';
                statusText.className = 'text-amber-400 tracking-wider text-[10px]';
                lapCountText.textContent = 'STATE: PAUSED';

            } else if (state === 'RESET') {
                setButtonState(startBtn, true);
                setButtonState(pauseBtn, false);

                statusIndicator.className = 'w-2.5 h-2.5 rounded-full bg-slate-600';
                statusText.textContent = 'READY';
                statusText.className = 'text-slate-400 tracking-wider text-[10px]';
                lapCountText.textContent = 'STATE: IDLE';
            }
        }

        /**
         * 切換按鈕的啟用/停用樣式 Helper
         */
        function setButtonState(btn, enabled) {
            btn.disabled = !enabled;
            if (enabled) {
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                btn.classList.add('hover:bg-cyan-500/20', 'active:bg-cyan-500/30');
                if (btn.id === 'pauseBtn') {
                    btn.classList.remove('text-amber-400/50', 'border-amber-500/20');
                    btn.classList.add('text-amber-400', 'border-amber-500/30', 'hover:bg-amber-500/20');
                }
            } else {
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                if (btn.id === 'pauseBtn') {
                    btn.classList.add('text-amber-400/50', 'border-amber-500/20');
                    btn.classList.remove('hover:bg-amber-500/20');
                }
            }
        }

        // 初始化顯示
        updateDisplay();
    </script>
</body>
</html>
